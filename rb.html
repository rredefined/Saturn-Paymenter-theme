<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Access | RenderByte</title>

<style>
:root{
  --accent:#19b7ff;
  --accent2:#3fd0ff;
  --text:#eaf6ff;
  --muted:#b7d1e6;

  --glass:rgba(12,20,36,.55);
  --glass2:rgba(12,20,36,.38);
  --border:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.55);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:#05080f;
  overflow:hidden;
}

/* ===== FADED BACKGROUND (LIKE SCREENSHOT) ===== */
.bg{
  position:fixed;
  inset:0;
  background:
    /* vignette */
    radial-gradient(1200px 700px at 50% 40%, rgba(0,0,0,.15), rgba(0,0,0,.75)),
    /* soft blue glow */
    radial-gradient(900px 500px at 20% 30%, rgba(25,183,255,.18), transparent 60%),
    radial-gradient(900px 500px at 80% 60%, rgba(63,208,255,.12), transparent 60%),
    /* dark veil */
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    /* image */
    url("/assets/bg.jpg");

  background-size:cover;
  background-position:center;
  filter:
    blur(2px)
    brightness(0.85)
    contrast(1.05)
    saturate(0.75);
  transform:scale(1.05);
  animation:bgDrift 20s ease-in-out infinite alternate;
}

@keyframes bgDrift{
  from{transform:scale(1.05) translateY(0)}
  to{transform:scale(1.08) translateY(-20px)}
}

/* ===== TOP BRAND ===== */
.topbar{
  position:fixed;
  top:26px;
  left:34px;
  z-index:5;
  display:flex;
  align-items:center;
  gap:14px;
}

.topbar img{
  width:34px;
  height:34px;
  object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(25,183,255,.45));
}

.topbar .name{
  font-size:30px;
  font-weight:900;
  color:var(--accent2);
  text-shadow:0 0 18px rgba(25,183,255,.25);
}

/* ===== LAYOUT ===== */
.wrap{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:110px 28px 60px;
}

.grid{
  width:min(1200px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:34px;
  align-items:center;
}

/* ===== LEFT CARD ===== */
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:14px;
  padding:34px 34px 28px;
  box-shadow:0 24px 70px var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  position:relative;
  overflow:hidden;
  min-height:320px;
}

.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  background:radial-gradient(600px 220px at 20% 10%, rgba(25,183,255,.22), transparent 60%);
  pointer-events:none;
}

.card h1{
  margin:0 0 14px;
  font-size:48px;
  line-height:1.05;
  color:var(--accent2);
  text-shadow:0 0 22px rgba(25,183,255,.18);
}

.card .sub{
  color:var(--muted);
  font-size:15px;
  line-height:1.55;
  margin-bottom:18px;
  max-width:520px;
}

.captcha-wrap{
  margin-top:16px;
}

/* ===== DISCORD PANEL ===== */
.discord{
  background:var(--glass2);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 24px 70px var(--shadow);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  min-height:420px;
  display:flex;
}

.discord iframe{
  width:100%;
  height:100%;
  min-height:420px;
  border:0;
}

.footnote{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:1px;
  text-transform:uppercase;
}

.footnote b{color:var(--accent2)}

/* ===== RESPONSIVE ===== */
@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .discord{min-height:360px}
  .card h1{font-size:40px}
  .topbar{left:18px; top:18px}
  .wrap{padding-top:95px}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <img src="/assets/eiro.png" alt="RenderByte">
  <div class="name">RenderByte</div>
</div>

<div class="wrap">
  <div class="grid">

    <!-- LEFT: VERIFY -->
    <div class="card">
      <h1>Verify Your Access</h1>
      <p class="sub">
        For enhanced security, please complete the verification below to access the panel.
        This helps us ensure you're a human and keep our services secure.
      </p>

      <div class="captcha-wrap">
        ::CAPTCHA_BOX::
      </div>

      <div class="footnote">
        Security Status: <b>Active</b> • Discord: <b>@Eiro.tf</b>
      </div>
    </div>

    <!-- RIGHT: DISCORD -->
    <div class="discord">
      <iframe
        src="https://discord.com/widget?id=1209386311207755787&theme=dark"
        allowtransparency="true"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
      </iframe>
    </div>

  </div>
</div>

</body>
</html>
