<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access | RenderByte</title>

<style>
:root {
    --bg-deep: #070d1a;
    --panel-bg: #0e1629;

    --accent: #19b7ff;
    --accent-2: #3fd0ff;
    --accent-glow: rgba(25,183,255,.65);

    --text-main: #ffffff;
    --text-dim: #9bb3c9;
    --border-glow: rgba(25,183,255,.25);
    --sync-speed: 4s;
}

body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Inter','Segoe UI',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    overflow:hidden;
}

/* Animated cyber backdrop */
.cyber-bg {
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(7,13,26,.9), rgba(7,13,26,.9)),
        repeating-linear-gradient(0deg, transparent 0, transparent 1px, rgba(25,183,255,.05) 1px, rgba(25,183,255,.05) 2px),
        repeating-linear-gradient(90deg, transparent 0, transparent 1px, rgba(25,183,255,.04) 1px, rgba(25,183,255,.04) 2px);
    background-size:100% 4px,40px 40px,40px 40px;
    animation:bgMove 30s linear infinite;
    z-index:-1;
}

@keyframes bgMove {
    from { background-position:0 0 }
    to   { background-position:0 300px }
}

/* Main vault card */
.vault-card {
    background: var(--panel-bg);
    padding:50px 40px;
    max-width:540px;
    width:95%;
    text-align:center;
    position:relative;
    border:1px solid var(--border-glow);
    box-shadow:0 0 55px rgba(0,0,0,.85), 0 0 25px var(--accent-glow);
    clip-path: polygon(5% 0,95% 0,100% 10%,100% 90%,95% 100%,5% 100%,0 90%,0 10%);
    animation: emerge 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes emerge {
    0% { opacity:0; transform:scale(.9) translateY(30px); filter:blur(10px); }
    100% { opacity:1; transform:scale(1) translateY(0); filter:none; }
}

/* Header */
.header-brand {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
}

.logo {
    width:70px;
    filter: drop-shadow(0 0 14px var(--accent-glow));
}

.brand-text {
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    animation: textPulse var(--sync-speed) infinite ease-in-out;
}

@keyframes textPulse {
    0%,100% {
        color:#fff;
        text-shadow:0 0 6px rgba(255,255,255,.25);
    }
    50% {
        color:var(--accent-2);
        text-shadow:0 0 25px var(--accent-glow), 0 0 40px var(--accent);
    }
}

.divider {
    width:2px;
    height:40px;
    background:linear-gradient(var(--accent),var(--accent-2));
    animation: dividerPulse var(--sync-speed) infinite ease-in-out;
}

@keyframes dividerPulse {
    0%,100% { opacity:.3 }
    50% { opacity:1; box-shadow:0 0 18px var(--accent) }
}

.title {
    font-size:.9rem;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:20px;
}

/* Challenge area */
.challenge-area {
    background:rgba(0,0,0,.45);
    margin:25px 0;
    padding:35px;
    border:1px solid rgba(25,183,255,.18);
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:110px;
}

.radar-sweep {
    position:absolute;
    inset:0;
    background:conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 300deg,
        var(--accent-2) 360deg
    );
    opacity:.22;
    animation:rotate var(--sync-speed) linear infinite;
}

@keyframes rotate {
    from { transform:rotate(0deg) }
    to { transform:rotate(360deg) }
}

.challenge-area::before {
    content:"";
    position:absolute;
    width:80%;
    height:80%;
    border:1px solid var(--accent);
    border-radius:50%;
    opacity:0;
    animation:ringPulse var(--sync-speed) infinite ease-out;
}

@keyframes ringPulse {
    0% { transform:scale(.6); opacity:.5 }
    100% { transform:scale(1.2); opacity:0 }
}

/* Footer */
.footer-text {
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:25px;
}

.accent-text {
    color:var(--accent-2);
    font-weight:bold;
}

/* Corner brackets */
.vault-card::before,
.vault-card::after {
    content:"";
    position:absolute;
    width:30px;
    height:30px;
    border:2px solid var(--accent);
    animation: dividerPulse var(--sync-speed) infinite ease-in-out;
}

.vault-card::before {
    top:15px;
    left:15px;
    border-right:0;
    border-bottom:0;
}
.vault-card::after {
    bottom:15px;
    right:15px;
    border-left:0;
    border-top:0;
}
</style>
</head>

<body>

<div class="cyber-bg"></div>

<div class="vault-card">
    <div class="header-brand">
        <img src="https://i.imgur.com/F93jLnz.png" alt="RenderByte" class="logo">
        <div class="divider"></div>
        <div class="brand-text">RenderByte Shield</div>
    </div>

    <h1 class="title">System Verification</h1>

    <p style="color:var(--text-dim);font-size:13px;margin-bottom:25px;">
        Establishing encrypted handshake with RenderByte edge network…
    </p>

    <div class="challenge-area">
        <div class="radar-sweep"></div>
        <div style="position:relative;z-index:2">
            ::CAPTCHA_BOX::
        </div>
    </div>

    <div class="footer-text">
        Security Status: <span class="accent-text">Active</span> |
        Discord: <span class="accent-text">@Eiro.tf</span>
    </div>
</div>

</body>
</html>
