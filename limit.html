<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Access Blocked | RenderByte Shield</title>
<style>
:root{--bg:#070d1a;--panel:#0e1629;--a1:#19b7ff;--a2:#3fd0ff;--glow:rgba(25,183,255,.65);--dim:#9bb3c9;--border:rgba(25,183,255,.22);--speed:4s}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(7,13,26,.9),rgba(7,13,26,.9)),repeating-linear-gradient(0deg,transparent 0,transparent 1px,rgba(25,183,255,.05) 1px,rgba(25,183,255,.05) 2px),repeating-linear-gradient(90deg,transparent 0,transparent 1px,rgba(25,183,255,.04) 1px,rgba(25,183,255,.04) 2px);background-size:100% 4px,40px 40px,40px 40px;animation:bgMove 30s linear infinite}
@keyframes bgMove{from{background-position:0 0}to{background-position:0 300px}}
.card{width:min(560px,95%);padding:50px 40px;text-align:center;background:var(--panel);border:1px solid var(--border);box-shadow:0 0 55px rgba(0,0,0,.85),0 0 25px var(--glow);clip-path:polygon(5% 0,95% 0,100% 10%,100% 90%,95% 100%,5% 100%,0 90%,0 10%);position:relative;animation:in 1s cubic-bezier(.2,.8,.2,1)}
@keyframes in{0%{opacity:0;transform:scale(.9) translateY(30px);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.card:before,.card:after{content:"";position:absolute;width:30px;height:30px;border:2px solid var(--a1);opacity:.7}
.card:before{top:15px;left:15px;border-right:0;border-bottom:0}.card:after{bottom:15px;right:15px;border-left:0;border-top:0}
.head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:22px}
.logo{width:72px;height:72px;border-radius:50%;border:2px solid var(--a1);box-shadow:0 0 18px var(--glow);display:flex;align-items:center;justify-content:center}
.logo img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 0 12px var(--glow))}
.div{width:2px;height:44px;background:linear-gradient(var(--a1),var(--a2));opacity:.6}
.brand{font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:26px;color:var(--a2);text-shadow:0 0 25px var(--glow)}
.title{margin:0 0 14px;color:var(--dim);letter-spacing:6px;text-transform:uppercase;font-size:.9rem}
.msg{color:var(--dim);font-size:14px;margin:0 0 18px}
.zone{background:rgba(0,0,0,.45);border:1px solid rgba(25,183,255,.18);padding:22px;margin-top:16px}
.code{color:var(--a2);font-weight:800;letter-spacing:2px}
.foot{margin-top:18px;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<div class="bg"></div>
<div class="card">
  <div class="head"><div class="logo"><img src="/assets/eiro.png" alt="Logo"></div><div class="div"></div><div class="brand">RenderByte Shield</div></div>
  <h1 class="title">Access Blocked</h1>
  <p class="msg">Your request was blocked by our Web Application Firewall to protect this service.</p>
  <div class="zone">
    <div class="code">403 — Forbidden</div>
    <p class="msg" style="margin:10px 0 0">If you believe this is a mistake, contact the site owner with details of what you were doing.</p>
  </div>
  <div class="foot">Status: <span class="code">Threat Mitigated</span></div>
</div>
</body></html>
