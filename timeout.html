<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connection Timed Out | RenderByte</title>
<style>
:root{--bg-deep:#070d1a;--panel-bg:#0e1629;--accent:#19b7ff;--accent-2:#3fd0ff;--accent-glow:rgba(25,183,255,.65);--text-main:#fff;--text-dim:#9bb3c9;--border-glow:rgba(25,183,255,.25)}
body{background:var(--bg-deep);color:var(--text-main);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;overflow:hidden}
.cyber-bg{position:fixed;inset:0;background:linear-gradient(rgba(7,13,26,.9),rgba(7,13,26,.9)),repeating-linear-gradient(0deg,transparent 0,transparent 1px,rgba(25,183,255,.05) 1px,rgba(25,183,255,.05) 2px),repeating-linear-gradient(90deg,transparent 0,transparent 1px,rgba(25,183,255,.04) 1px,rgba(25,183,255,.04) 2px);background-size:100% 4px,40px 40px,40px 40px;z-index:-1}
.vault-card{background:var(--panel-bg);padding:50px 40px;max-width:540px;width:95%;text-align:center;position:relative;border:1px solid var(--border-glow);box-shadow:0 0 55px rgba(0,0,0,.85),0 0 25px var(--accent-glow);clip-path:polygon(5% 0,95% 0,100% 10%,100% 90%,95% 100%,5% 100%,0 90%,0 10%)}
.header-brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:35px}
.logo{width:70px;filter:drop-shadow(0 0 14px var(--accent-glow))}
.divider{width:2px;height:40px;background:linear-gradient(var(--accent),var(--accent-2));opacity:.6}
.brand-text{font-size:28px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--accent-2);text-shadow:0 0 25px var(--accent-glow)}
.title{font-size:.9rem;letter-spacing:6px;text-transform:uppercase;color:var(--text-dim);margin:0 0 16px 0}
.block{background:rgba(0,0,0,.45);border:1px solid rgba(25,183,255,.18);padding:22px;margin-top:16px}
.code{color:var(--accent-2);font-weight:800;letter-spacing:2px}
.cfbox{display:none}
.footer-text{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-top:25px}
</style></head>
<body>
<div class="cyber-bg"></div>
<div class="vault-card">
  <div class="header-brand">
    <img src="/assets/eiro.png" alt="RenderByte" class="logo">
    <div class="divider"></div>
    <div class="brand-text">RenderByte Shield</div>
  </div>

  <h1 class="title">Connection Timed Out</h1>
  <p style="color:var(--text-dim);font-size:13px;margin:0 0 14px;">
    Cloudflare connected, but the origin server did not respond in time.
  </p>

  <div class="block">
    <div class="cfbox">::CLOUDFLARE_ERROR_500S_BOX::</div>
    <div class="code">522 / 524 — Timeout</div>
    <p style="color:var(--text-dim);font-size:13px;margin:10px 0 0;">
      This may be caused by high load, network issues, or an offline origin server.
    </p>
  </div>

  <div class="footer-text">
    Status: <span class="code">Awaiting Origin</span>
  </div>
</div>
</body></html>
